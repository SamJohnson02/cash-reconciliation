name: cash-recon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cash
      POSTGRES_PASSWORD: cash
      POSTGRES_DB: cash_recon
    ports:
      - "54329:5432"
    volumes:
      - cash_recon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cash -d cash_recon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cash_recon_pg:
